subprojects {
    apply plugin: 'java-library'

    group = 'moe.kyokobot'
    version = '2.0.0-SNAPSHOT'

    sourceCompatibility = 11
    targetCompatibility = 11

    repositories {
        mavenCentral()
        mavenLocal()

        maven { url "https://maven.lavalink.dev/releases" }
        maven { url "https://jitpack.io/" }
    }
}
